<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020A22">
<meta name="robots" content="noindex">
<title>الحساب — SPONGE LIVE</title>
<link rel="icon" href="/brand/favicon-64.png" type="image/png">
<link rel="stylesheet" href="/home.css">
<link rel="stylesheet" href="/pages.css">
<script defer src="/google.js"></script>
<script defer src="/auth.js"></script>
</head>
<body class="hm pg">
<div class="hm-sea" aria-hidden="true"><span class="hm-glow"></span><span class="hm-rays"></span>
 <i class="hm-b"></i><i class="hm-b"></i><i class="hm-b"></i><i class="hm-b"></i><i class="hm-b"></i>
</div>
<header class="pg-top">
 <a class="pg-brand" href="/" dir="ltr"><img src="/brand/sponge-128.webp" alt="" width="40" height="40"><span><b>SPONGE</b> LIVE</span></a>
 <nav class="pg-nav" aria-label="روابط"><a href="/">الرئيسية</a><a href="/#plans">الباقات</a></nav>
</header>
<main class="pg-main">
 <div class="pg-narrow">
  <section class="pg-card" aria-labelledby="authTitle">
   <nav class="pg-tabs" aria-label="نوع الدخول"><a href="/signup" id="tabSignup">إنشاء حساب جديد</a><a href="/login" id="tabLogin">تسجيل الدخول</a></nav>
   <h1 id="authTitle">إنشاء حساب جديد</h1>
   <p class="pg-sub" id="authSub">حسابك يحصل على معرّف دائم مثل <bdi dir="ltr">SPG-8F42K9</bdi> تستخدمه للتجربة والاشتراك والدعم.</p>
   <p class="pg-msg is-info" id="authNotice" hidden></p>
   <label class="pg-check"><input type="checkbox" id="rememberMe" checked><span>تذكرني لمدة 30 يوماً</span></label>
   <div class="pg-google" id="googleBox" hidden></div>
   <p class="pg-or" id="googleOr" hidden><span>أو بالبريد الإلكتروني</span></p>
   <p class="pg-msg is-err" id="googleError" role="alert" hidden></p>
   <form class="pg-form" id="signupForm" novalidate>
    <label class="pg-field"><span>اسم المستخدم</span><input name="username" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required><small>3–24 حرفًا إنجليزيًا صغيرًا أو رقمًا أو _ .</small><em class="pg-ferr" data-for="username" hidden></em></label>
    <label class="pg-field"><span>البريد الإلكتروني</span><input name="email" type="email" dir="ltr" autocomplete="email" maxlength="254" required><em class="pg-ferr" data-for="email" hidden></em></label>
    <label class="pg-field"><span>كلمة المرور</span><input name="password" type="password" dir="ltr" autocomplete="new-password" minlength="8" maxlength="128" required><small>8 أحرف على الأقل، حروف وأرقام معًا.</small><em class="pg-ferr" data-for="password" hidden></em></label>
    <label class="pg-field"><span>تأكيد كلمة المرور</span><input name="confirm" type="password" dir="ltr" autocomplete="new-password" maxlength="128" required><em class="pg-ferr" data-for="confirm" hidden></em></label>
    <p class="pg-msg is-err" id="signupError" role="alert" hidden></p>
    <button class="pg-btn" type="submit">إنشاء الحساب</button>
    <p class="pg-note">بإنشاء الحساب فأنت توافق على <a href="/terms">شروط الاستخدام</a> و<a href="/privacy">سياسة الخصوصية</a>.</p>
   </form>
   <form class="pg-form" id="loginForm" novalidate hidden>
    <label class="pg-field"><span>اسم المستخدم أو البريد الإلكتروني</span><input name="identifier" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required><em class="pg-ferr" data-for="identifier" hidden></em></label>
    <label class="pg-field"><span>كلمة المرور</span><input name="password" type="password" dir="ltr" autocomplete="current-password" maxlength="128" required><em class="pg-ferr" data-for="password" hidden></em></label>
    <p class="pg-msg is-err" id="loginError" role="alert" hidden></p>
    <button class="pg-btn" type="submit">تسجيل الدخول</button>
    <p class="pg-note">لديك رمز ترويجي من الفريق؟ <a href="/">أدخله في الصفحة الرئيسية</a>.</p>
   </form>
  </section>
 </div>
</main>
</body>
</html>
