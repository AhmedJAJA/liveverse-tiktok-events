<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060A">
<meta name="description" content="صفحة الانضمام: اكتب انضم في شات البث لبدء اللعب — SKY LIVE">
<title>انضم للعبة | SKY LIVE</title>
<link rel="icon" href="/sky-live-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/royal-core.css">
<link rel="stylesheet" href="/account.css">
<link rel="stylesheet" href="/play.css">
<script defer src="/session.js"></script>
<script defer src="/account.js"></script>
<script defer src="/play.js"></script>
</head>
<body class="pl-page" data-category="smart" data-view="join">
<div class="pl-backdrop" aria-hidden="true"><img id="backdropCover" src="/covers/quiz.svg" alt=""><span class="pl-vignette"></span></div>

<header class="pl-bar">
 <a class="pl-back" href="/#games"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-arrow"/></svg><span>الألعاب</span></a>
 <a class="pl-brand" href="/" aria-label="SKY LIVE — الرئيسية"><img src="/sky-live-mark.svg" alt="" width="30" height="30"><span dir="ltr">SKY LIVE</span></a>
 <div class="pl-bar-tools">
  <span class="pl-room" id="roomBadge" hidden></span>
  <a class="pl-chip" id="overlayLink" href="/overlay" target="_blank" rel="noopener" hidden><svg class="i" aria-hidden="true"><use href="/icons.svg#i-screen"/></svg><span>شاشة OBS</span></a>
  <a class="pl-chip" id="setupLink" href="/studio" hidden><svg class="i" aria-hidden="true"><use href="/icons.svg#i-gear"/></svg><span>إعدادات</span></a>
 </div>
</header>

<main class="pl-main">
 <!-- ===== Game identity ===== -->
 <section class="pl-hero" aria-labelledby="gameTitle">
  <figure class="pl-cover"><img id="gameCover" src="/covers/quiz.svg" alt="" width="220" height="220"></figure>
  <div class="pl-id">
   <span class="pl-cat" id="gameCategory">الذكاء والسرعة</span>
   <h1 id="gameTitle">تحدي المعلومات</h1>
   <p id="gameSummary"></p>
   <ul class="pl-rules" id="gameRules"></ul>
  </div>
 </section>

 <!-- ===== Join call ===== -->
 <section class="pl-call" id="joinCall" aria-live="polite">
  <p class="pl-call-main">اكتب <b class="pl-word" id="joinWord">انضم</b> في شات البث لبدء اللعب</p>
  <p class="pl-call-sub" id="callSub"><span class="pl-pulse" aria-hidden="true"></span><span id="callSubText">بانتظار انضمام اللاعبين</span></p>
  <div class="pl-count"><b id="playerCount">0</b><span id="playerCountLabel">لاعب منضم</span></div>
 </section>

 <!-- ===== Live game (after start) ===== -->
 <section class="pl-live" id="liveView" hidden aria-label="اللعبة الجارية">
  <div class="pl-live-head">
   <span class="pl-live-tag"><i aria-hidden="true"></i>اللعبة جارية</span>
   <p id="liveNotice"></p>
  </div>
  <div class="pl-frame"><iframe id="liveFrame" title="شاشة اللعبة" src="about:blank" loading="lazy"></iframe></div>
  <p class="pl-late" id="lateNote">وصلت متأخرًا؟ اكتب <b class="pl-word-sm">انضم</b> وستدخل الجولة التالية تلقائيًا<span id="lateCount"></span></p>
 </section>

 <!-- ===== Roster ===== -->
 <section class="pl-roster" aria-labelledby="rosterTitle">
  <div class="pl-roster-head">
   <h2 id="rosterTitle">المشاركون</h2>
   <span class="pl-need" id="needNote"></span>
  </div>
  <ol class="pl-players" id="players"></ol>
  <p class="pl-empty" id="rosterEmpty">لا يوجد لاعبون بعد — أول من يكتب «<span class="pl-word-inline">انضم</span>» يظهر هنا.</p>
 </section>

 <p class="pl-feedback" id="feedback" role="status" aria-live="polite"></p>
</main>

<!-- ===== Admin controls (only rendered for the room's host) ===== -->
<div class="pl-admin" id="adminBar" hidden>
 <div class="pl-admin-inner">
  <div class="pl-admin-join" id="adminJoin">
   <div class="pl-guess" id="guessFields" hidden>
    <label><span>التلميح للجمهور</span><input id="guessPrompt" maxlength="200" dir="auto" placeholder="مثال: عاصمة فرنسا"></label>
    <label><span>الإجابة السرية</span><input id="guessAnswer" maxlength="80" dir="auto" placeholder="باريس" autocomplete="off"></label>
   </div>
   <button type="button" class="pl-btn pl-btn-line" id="hostSeatButton" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-user-plus"/></svg><span id="hostSeatLabel">شارك كلاعب</span></button>
   <button type="button" class="pl-btn pl-btn-ghost" id="demoButton" title="لتجربة اللعبة بدون بث"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-robot"/></svg><span>لاعبون تجريبيون</span></button>
   <button type="button" class="pl-btn pl-btn-gold" id="startButton" disabled><svg class="i" aria-hidden="true"><use href="/icons.svg#i-play"/></svg><span id="startLabel">ابدأ اللعبة</span></button>
  </div>
  <div class="pl-admin-live" id="adminLive" hidden>
   <button type="button" class="pl-btn pl-btn-gold" id="drawButton" hidden><svg class="i" aria-hidden="true"><use href="/icons.svg#i-wheel"/></svg><span>اسحب الفائز</span></button>
   <button type="button" class="pl-btn pl-btn-ghost" id="advanceButton"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-forward"/></svg><span>التالي</span></button>
   <button type="button" class="pl-btn pl-btn-danger" id="stopButton"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-stop"/></svg><span>إنهاء اللعبة</span></button>
  </div>
  <div class="pl-admin-done" id="adminDone" hidden>
   <button type="button" class="pl-btn pl-btn-gold" id="againButton"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-refresh"/></svg><span>جولة جديدة</span></button>
  </div>
 </div>
</div>
</body>
</html>
