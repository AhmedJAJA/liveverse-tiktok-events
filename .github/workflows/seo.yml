name: SEO and site checks
# Runs the search-engine regression suite (tests/seo.test.mjs) and the rest of the tests on every pull request.
# Everything runs against a local server: no request goes to Google, Bing or the production site.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the sitemap lastmod check compares each page with its last commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install a browser for the rendering checks
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Syntax check
        run: npm run check && node --check src/seo.mjs && node --check tools/indexnow.mjs
      - name: SEO regression suite
        run: node --test tests/seo.test.mjs
      - name: All tests
        run: npm test
