name: Import LIVEVERSE source and verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified source archive if present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f release/parts/01.txt ]; then
            echo "Source import already complete."
            exit 0
          fi
          cat release/parts/{01,02,03,04,05,06}.txt | base64 -d > /tmp/liveverse-src.tar.xz
          echo "ab9efcceed3f68ee2abde731adaea92d268630fb7749ebe01f517978e8607bd8  /tmp/liveverse-src.tar.xz" | sha256sum -c -
          tar -xJf /tmp/liveverse-src.tar.xz -C .
          rm -rf release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import tested LIVEVERSE source v0.1"
          git push
  test:
    needs: import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip before source import
        run: |
          if [ ! -f package.json ]; then
            echo "Source import commit will run tests on next push."
            exit 0
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run engine tests
        run: |
          if [ -f package.json ]; then npm test && npm run check; fi

